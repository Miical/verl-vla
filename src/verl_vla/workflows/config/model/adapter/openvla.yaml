# Main RGB observation in the canonical LeRobot LIBERO dataset.
image_key: observation.images.image

# Language task field in the canonical LeRobot batch.
task_key: task

# Dataset statistics used for action tokenization and rollout decoding.
unnorm_key: libero_spatial_no_noops

# Optional action statistics generated from the training dataset.
norm_stats_path: null

# Convert LeRobot's robosuite gripper convention to native RLDS actions.
action_transform: libero

# Prompt used by the native OpenVLA checkpoint.
prompt_template: "In: What action should the robot take to {task}?\nOut:"
